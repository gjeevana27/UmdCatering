name: Evals

on:
  push:
  pull_request:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: contract_agent.py eval (evaluate_contract_agent.py)
        run: python evaluation/evaluate_contract_agent.py

# evaluate_llm_judgment.py and evaluate_extraction.py are deliberately
# NOT run here -- they make real, billed Gemini API calls and need
# GEMINI_API_KEY (evaluate_extraction.py also needs real hand-labeled
# photos that don't exist in this repo). Both stay opt-in, run manually.
