name: Evals

on:
  push:
  pull_request:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: agent.py eval (evaluate.py)
        run: python evaluation/evaluate.py
      - name: contract_agent.py eval (evaluate_contract_agent.py)
        run: python evaluation/evaluate_contract_agent.py

# evaluate_llm_judgment.py is deliberately NOT run here -- it makes real,
# billed Gemini API calls and needs GEMINI_API_KEY. Kept opt-in, run
# manually, same reasoning as it being excluded from every other
# automated path in this repo.
